<!doctype html>
<html lang="en" class="light-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Verdict scans Reddit, influencer reviews and complaint boards to expose fake reviews before you buy from unfamiliar online stores."
    />
    <title>Verdict</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Light mode is the default; switch to dark before first paint if previously saved.
      try {
        if (localStorage.getItem('verdict-theme') === 'dark') {
          document.documentElement.classList.remove('light-mode')
          document.documentElement.classList.add('dark-mode')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
